services:

  # ============================================================
  # Demo workload monitored by Zabbix and remediated by Mini-SOAR
  # ============================================================
  demo-web:
    build:
      context: .
      dockerfile: docker/demo-web.Dockerfile

    image: ${DEMO_WEB_IMAGE:-mini-soar-demo-web:latest}

    container_name: demo-web

    ports:
      - "8000:8000"

    restart: unless-stopped


  # ============================================================
  # Mini-SOAR automation engine
  #
  # Host networking is intentionally used in this lab because:
  # - MariaDB currently listens on the host
  # - existing DB_HOST=127.0.0.1 remains valid
  #
  # Docker socket access allows DockerService to remediate
  # allowlisted containers on the host Docker Engine.
  # ============================================================
  mini-soar-api:
    build:
      context: .
      dockerfile: docker/mini-soar.Dockerfile

    image: ${MINI_SOAR_API_IMAGE:-mini-soar-api:latest}

    container_name: mini-soar-api

    network_mode: host

    env_file:
      - .env

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped


  # ============================================================
  # Read-only Security Operations Dashboard
  # React production build served by Nginx
  # ============================================================
  mini-soar-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${DASHBOARD_IMAGE:-mini-soar-dashboard:latest}

    container_name: mini-soar-dashboard

    ports:
      - "8080:80"

    environment:
      API_UPSTREAM: http://host.docker.internal:9000

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
